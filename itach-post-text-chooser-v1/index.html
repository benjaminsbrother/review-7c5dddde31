<style>
  :root { --sky:#1b617d; --ink:#182c3b; --paper:#fffaf1; --ok:#2e7d4f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; background:#eef3f8; color:var(--ink); }
  header { background:var(--sky); color:var(--paper); padding:20px 16px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:6px 0 0; font-size:14px; opacity:.9; }
  main { max-width:720px; margin:0 auto; padding:12px 12px 140px; }
  section { background:#fff; border-radius:14px; padding:14px; margin:14px 0; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  h2 { font-size:17px; margin:0 0 10px; }
  .opt { display:block; width:100%; text-align:right; font:inherit; background:#f6f8fb; border:2px solid #d6dde6;
          border-radius:12px; padding:12px; margin:8px 0; color:var(--ink); cursor:pointer; }
  .opt.on { border-color:var(--ok); background:#eef8f1; }
  .opt b { font-size:15px; }
  .txt { font-size:15px; margin-top:6px; line-height:1.5; }
  .why { font-size:12px; color:#647078; margin-top:6px; }
  .preview-wrap { display:flex; flex-direction:column; gap:10px; }
  .preview-wrap img { width:100%; border-radius:10px; display:block; }
  #preview { white-space:pre-wrap; font-size:15px; line-height:1.55; background:var(--paper); border-radius:10px; padding:12px; }
  input, textarea { width:100%; font:inherit; border:1px solid #c9d2dc; border-radius:10px; padding:10px; }
  textarea { min-height:70px; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid #d6cbb9; padding:10px; display:flex; gap:8px; }
  .bar button { flex:1; padding:14px 8px; border:0; border-radius:10px; background:var(--sky); color:#fff; font-weight:700; font-size:15px; }
  .bar button.sec { background:#475e71; }
  .chk { display:flex; gap:8px; align-items:center; font-size:15px; margin-top:8px; }
  .chk input { width:auto; }

<body>
<header>
  <h1>איתך - נוסח הפוסט</h1>
  <p>לבחור בכל שלב, הפוסט המלא מתעדכן למטה. בסוף: "להעתיק את הפוסט" ולהדביק באינסטגרם, או "להעתיק בחירות" ולשלוח לי.</p>
</header>
<main>
<section>
  <h2>1. הכיוון של הפוסט</h2>
  <button class="opt on" data-group="dir" data-key="orig" onclick="pick(this)"><b>המקור שלך</b><div class="txt">אהבה זה דבר מורכב.<br>אבל יש אנשים שהמסע איתם הופך את המורכבות לעבודה קשה, עם תוצאות בהתאם.<br><br>אז האישה שלי חוגגת 39 היום, ואין דרך טובה יותר מלהרים לה ולהוציא שיר לכבודה.<br>הבחירה הייתה בין זה לבין אוסף תמונות מביכות שלה ישנה/אוכלת וכו׳ ולישון על הספה לכמה ימים, אז אני מקווה שבחרתי נכון.<br><br>תודה על המסע המורכב הזה, בייב.<br>(שורת ארבע הקירות לפי שלב 2)</div><div class="why">הטקסט שלך כמו שכתבת, עם שני תיקונים קטנים: "על הספה" ופסיק לפני "בייב". שורת ארבע הקירות נבחרת בשלב 2.</div></button><button class="opt" data-group="dir" data-key="lyric" onclick="pick(this)"><b>כיוון 1: השיר פותח</b><div class="txt">מאות נורות של אזהרה ונשיקה אחת בינינו.<br>ככה זה התחיל.<br><br>אהבה זה דבר מורכב. אבל יש אנשים שהמסע איתם הופך את המורכבות לעבודה קשה, עם תוצאות בהתאם.<br><br>היום האישה שלי חוגגת 39, ו"איתך" יוצא לכבודה.<br>תודה על המסע המורכב הזה, בייב.<br>מסתבר שהחופש באמת מתגלה דווקא בין ארבע קירות.</div><div class="why">פותח בשורה מהשיר, כך שמי שגולל רואה מיד שזה שיר ולא רק ברכה. נשארים: מורכב ועבודה קשה, התודה, ארבע הקירות. יוצאת: הבדיחה על התמונות המביכות.</div></button><button class="opt" data-group="dir" data-key="humor" onclick="pick(this)"><b>כיוון 2: ההומור פותח, קצר</b><div class="txt">הבחירה הייתה בין שתי אפשרויות:<br>לפרסם אוסף תמונות מביכות של האישה שלי ישנה/אוכלת וכו׳, ולישון על הספה לכמה ימים.<br>או להוציא שיר לכבודה.<br><br>היא חוגגת 39 היום. אני מקווה שבחרתי נכון.<br><br>אהבה זה דבר מורכב. איתה זו עבודה קשה, עם תוצאות בהתאם.<br>תודה על המסע, בייב.</div><div class="why">הבדיחה שלך עולה לראש: היא הכי עוצרת גלילה. אותן מילים שלך, בסדר אחר וקצר יותר. יוצאת: שורת ארבע הקירות.</div></button><button class="opt" data-group="dir" data-key="letter" onclick="pick(this)"><b>כיוון 3: מכתב אליה</b><div class="txt">בייב,<br>היום את בת 39.<br><br>אהבה זה דבר מורכב, ואת יודעת את זה יותר מכולם. אבל המסע איתך הפך את המורכבות לעבודה קשה, עם תוצאות בהתאם.<br><br>יכולתי לפרסם את אוסף התמונות המביכות שלך ישנה ואוכלת. בחרתי לכתוב לך שיר. אני מקווה שבחרתי נכון, ושלא אישן על הספה.<br><br>תודה על המסע המורכב הזה.<br>מסתבר שהחופש באמת מתגלה דווקא בין ארבע קירות. איתך.</div><div class="why">הכל בגוף שני, ישירות אליה. כל המשפטים שלך נשארים, רק פונים אליה. נגמר במילה "איתך", שם השיר.</div></button>
</section>
<section>
  <h2>2. שורת ארבע הקירות (רק למקור שלך)</h2>
  <button class="opt" data-group="walls" data-key="orig" onclick="pick(this)"><b>הנוסח שלך</b><div class="txt">מסתבר שחופש אכן קיים בתוך ארבע קירות.</div></button><button class="opt on" data-group="walls" data-key="song" onclick="pick(this)"><b>קריצה לשורה בשיר</b><div class="txt">מסתבר שהחופש באמת מתגלה דווקא בין ארבע קירות.</div></button>
</section>
<section>
  <h2>3. קריאה לפעולה</h2>
  <button class="opt on" data-group="cta" data-key="a" onclick="pick(this)"><b>א. שליחה (ההמלצה שלי)</b><div class="txt">אם יש מישהו שאיתו המורכבות שווה את זה, שלחו לו את השיר. בלי הסבר, יבינו.</div><div class="why">שליחה בהודעה פרטית היא האות הכי חזק לאינסטגרם, ולא נחשבת בקשת תיוג.</div></button><button class="opt" data-group="cta" data-key="b" onclick="pick(this)"><b>ב. תיוג, ברכות</b><div class="txt">יש לכם מישהו כזה? תייגו אותו. שידע שרואים את העבודה הקשה.</div><div class="why">הרעיון שלך. בקשת תיוג עלולה להוריד חשיפה בפייסבוק ובאינסטגרם.</div></button><button class="opt" data-group="cta" data-key="c" onclick="pick(this)"><b>ג. שאלה שחוזרת לשיר</b><div class="txt">ואצלכם, איפה מצאתם את החופש בין ארבע הקירות? ספרו לי, ותייגו את מי שמצאתם אותו איתו.</div><div class="why">מזמין תגובות אמיתיות. עדיין יש בו בקשת תיוג.</div></button><button class="opt" data-group="cta" data-key="none" onclick="pick(this)"><b>בלי קריאה לפעולה</b><div class="txt"><i>ללא שורה</i></div><div class="why">רק הסיפור והשיר.</div></button>
</section>
<section>
  <h2>4. שני</h2>
  <input id="shani" placeholder="התיוג של שני, למשל @shani..." oninput="render()">
  <label class="chk"><input type="checkbox" id="shaniTop" onchange="render()"> לתייג אותה בטקסט (במקור: בשורת התודה, בכיוונים: בסוף הסיפור)</label>

  <label class="chk"><input type="checkbox" id="tags" checked onchange="render()"> להוסיף האשטגים</label>
</section>

<script>
const D = {"dirs": {"orig": ["המקור שלך", null, "הטקסט שלך כמו שכתבת, עם שני תיקונים קטנים: \"על הספה\" ופסיק לפני \"בייב\". שורת ארבע הקירות נבחרת בשלב 2."], "lyric": ["כיוון 1: השיר פותח", ["מאות נורות של אזהרה ונשיקה אחת בינינו.", "ככה זה התחיל.", "", "אהבה זה דבר מורכב. אבל יש אנשים שהמסע איתם הופך את המורכבות לעבודה קשה, עם תוצאות בהתאם.", "", "היום האישה שלי חוגגת 39, ו\"איתך\" יוצא לכבודה.", "תודה על המסע המורכב הזה, בייב.", "מסתבר שהחופש באמת מתגלה דווקא בין ארבע קירות."], "פותח בשורה מהשיר, כך שמי שגולל רואה מיד שזה שיר ולא רק ברכה. נשארים: מורכב ועבודה קשה, התודה, ארבע הקירות. יוצאת: הבדיחה על התמונות המביכות."], "humor": ["כיוון 2: ההומור פותח, קצר", ["הבחירה הייתה בין שתי אפשרויות:", "לפרסם אוסף תמונות מביכות של האישה שלי ישנה/אוכלת וכו׳, ולישון על הספה לכמה ימים.", "או להוציא שיר לכבודה.", "", "היא חוגגת 39 היום. אני מקווה שבחרתי נכון.", "", "אהבה זה דבר מורכב. איתה זו עבודה קשה, עם תוצאות בהתאם.", "תודה על המסע, בייב."], "הבדיחה שלך עולה לראש: היא הכי עוצרת גלילה. אותן מילים שלך, בסדר אחר וקצר יותר. יוצאת: שורת ארבע הקירות."], "letter": ["כיוון 3: מכתב אליה", ["בייב,", "היום את בת 39.", "", "אהבה זה דבר מורכב, ואת יודעת את זה יותר מכולם. אבל המסע איתך הפך את המורכבות לעבודה קשה, עם תוצאות בהתאם.", "", "יכולתי לפרסם את אוסף התמונות המביכות שלך ישנה ואוכלת. בחרתי לכתוב לך שיר. אני מקווה שבחרתי נכון, ושלא אישן על הספה.", "", "תודה על המסע המורכב הזה.", "מסתבר שהחופש באמת מתגלה דווקא בין ארבע קירות. איתך."], "הכל בגוף שני, ישירות אליה. כל המשפטים שלך נשארים, רק פונים אליה. נגמר במילה \"איתך\", שם השיר."]}, "opening": ["אהבה זה דבר מורכב.", "אבל יש אנשים שהמסע איתם הופך את המורכבות לעבודה קשה, עם תוצאות בהתאם.", "", "אז האישה שלי חוגגת 39 היום, ואין דרך טובה יותר מלהרים לה ולהוציא שיר לכבודה.", "הבחירה הייתה בין זה לבין אוסף תמונות מביכות שלה ישנה/אוכלת וכו׳ ולישון על הספה לכמה ימים, אז אני מקווה שבחרתי נכון.", "", "תודה על המסע המורכב הזה, בייב."], "walls": {"orig": ["הנוסח שלך", "מסתבר שחופש אכן קיים בתוך ארבע קירות."], "song": ["קריצה לשורה בשיר", "מסתבר שהחופש באמת מתגלה דווקא בין ארבע קירות."]}, "cta": {"a": ["א. שליחה (ההמלצה שלי)", "אם יש מישהו שאיתו המורכבות שווה את זה, שלחו לו את השיר. בלי הסבר, יבינו.", "שליחה בהודעה פרטית היא האות הכי חזק לאינסטגרם, ולא נחשבת בקשת תיוג."], "b": ["ב. תיוג, ברכות", "יש לכם מישהו כזה? תייגו אותו. שידע שרואים את העבודה הקשה.", "הרעיון שלך. בקשת תיוג עלולה להוריד חשיפה בפייסבוק ובאינסטגרם."], "c": ["ג. שאלה שחוזרת לשיר", "ואצלכם, איפה מצאתם את החופש בין ארבע הקירות? ספרו לי, ותייגו את מי שמצאתם אותו איתו.", "מזמין תגובות אמיתיות. עדיין יש בו בקשת תיוג."], "none": ["בלי קריאה לפעולה", "", "רק הסיפור והשיר."]}, "release": "\"איתך\" בחוץ עכשיו. לינק בביו.", "credits": ["קרדיטים:", "מילים, לחן, הפקה, שירה וגיטרה: יוסף בך", "מקלדות וסינתיסייזרים: נועם חבקין (נומוק) @_nomok_", "פסנתר: עדי קשת כהן @adikeshetcohen, יוסף בך", "בס: צוק דבוסק", "תופים: נדב לוזיה @nadavluzia", "מיקס ומאסטר: נועם לוינברג @noamlevinberg"], "tags": "#איתך #יוסףבך #שירחדש #מוזיקהישראלית #פולקישראלי #שירבעברית #JosephBach #newmusic #israelimusic"};
const S = {dir:"orig", walls:"song", cta:"a"};
function pick(btn) {
  const g = btn.dataset.group;
  document.querySelectorAll('.opt[data-group="'+g+'"]').forEach(b => b.classList.remove('on'));
  btn.classList.add('on'); S[g] = btn.dataset.key; render();
}
function build() {
  const shani = document.getElementById('shani').value.trim();
  const dir = D.dirs[S.dir];
  let lines;
  if (dir[1] === null) {
    lines = D.opening.slice();
    if (shani && document.getElementById('shaniTop').checked) {
      lines[lines.length-1] = "תודה על המסע המורכב הזה, בייב " + shani + ".";
    }
    lines.push(D.walls[S.walls][1]);
  } else {
    lines = dir[1].slice();
    if (shani && document.getElementById('shaniTop').checked) { lines.push("", shani); }
  }
  const cta = D.cta[S.cta][1];
  if (cta) { lines.push("", cta); }
  lines.push("", D.release);
  if (document.getElementById('credits').checked) { lines.push("", ...D.credits); }
  if (document.getElementById('tags').checked) { lines.push("", D.tags); }
  return lines.join("\n");
}
function render() { document.getElementById('preview').textContent = build(); }
function copy(t, msg) {
  navigator.clipboard.writeText(t).then(()=>alert(msg), ()=>prompt('להעתיק:', t));
}
function copyPost() { copy(build(), 'הפוסט הועתק. להדביק באינסטגרם.'); }
function copyChoices() {
  const shani = document.getElementById('shani').value.trim() || 'לא מולא';
  const n = document.getElementById('notes').value.trim();
  const t = 'בחירות פוסט איתך\n- כיוון: ' + D.dirs[S.dir][0] + '\n- ארבע קירות: ' + D.walls[S.walls][0] + '\n- קריאה לפעולה: ' + D.cta[S.cta][0]
          + '\n- שני: ' + shani + (document.getElementById('shaniTop').checked ? ' (גם בשורת התודה)' : '')
          + (n ? '\n- הערות: ' + n : '');
  copy(t, 'הבחירות הועתקו. להדביק בצ\'אט.');
}
render();
</script>
</body>
</html>
